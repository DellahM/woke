backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

# Media storage
media_folder: "static/img/uploads"
public_folder: "/img/uploads"

# Editorial Workflow (optional - enables draft/publish/review system)
publish_mode: editorial_workflow

collections:
  # Blog Posts Collection
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", required: true}
      - {label: "Author", name: "author", widget: "string", default: "WOKE Team"}
      - {label: "Categories", name: "categories", widget: "list", default: ["Technology"]}
      - {label: "Featured Image", name: "image", widget: "image", required: true, media_folder: "static/img/uploads/blog"}
      - {label: "Excerpt", name: "excerpt", widget: "text", required: true}
      - {label: "Body", name: "body", widget: "markdown", required: true}
      - {label: "SEO Title", name: "seo_title", widget: "string", required: false}
      - {label: "Meta Description", name: "meta_description", widget: "text", required: false}

  # Projects Collection
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    preview_path: "portfolio/{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Client", name: "client", widget: "string", required: true}
      - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM", required: true}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Category", name: "category", widget: "select", 
         options: ["Web Development", "Mobile App", "E-Commerce", "SaaS"], required: true}
      - {label: "Cover Image", name: "image", widget: "image", required: true, media_folder: "static/img/uploads/projects"}
      - {label: "Gallery", name: "gallery", widget: "list", 
         field: {label: "Image", name: "image", widget: "image", media_folder: "static/img/uploads/projects/gallery"}}
      - {label: "Description", name: "description", widget: "markdown", required: true}
      - {label: "Technologies", name: "technologies", widget: "list", 
         field: {label: "Technology", name: "tech", widget: "string"}}
      - {label: "Project URL", name: "url", widget: "string", required: false}
      - {label: "Case Study", name: "case_study", widget: "markdown", required: false}

  # Team Members Collection
  - name: "team"
    label: "Team Members"
    label_singular: "Team Member"
    folder: "content/team"
    create: true
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string", required: true}
      - {label: "Position", name: "position", widget: "string", required: true}
      - {label: "Photo", name: "photo", widget: "image", required: true, media_folder: "static/img/uploads/team"}
      - {label: "Bio", name: "bio", widget: "markdown", required: true}
      - {label: "Social Links", name: "social", widget: "object", 
         fields: [
           {label: "Twitter", name: "twitter", widget: "string", required: false},
           {label: "LinkedIn", name: "linkedin", widget: "string", required: false},
           {label: "GitHub", name: "github", widget: "string", required: false}
         ]}
      - {label: "Order", name: "order", widget: "number", default: 0}

  # Services Collection
  - name: "services"
    label: "Services"
    label_singular: "Service"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string", required: true}
      - {label: "Icon", name: "icon", widget: "select",
         options: ["💻", "📱", "🛒", "🔌", "🎨", "📊"], required: true}
      - {label: "Short Description", name: "short_desc", widget: "string", required: true}
      - {label: "Description", name: "description", widget: "markdown", required: true}
      - {label: "Features", name: "features", widget: "list", 
         field: {label: "Feature", name: "feature", widget: "string"}}
      - {label: "Pricing", name: "pricing", widget: "list",
         field: {label: "Tier", name: "tier", widget: "object",
         fields: [
           {label: "Name", name: "name", widget: "string"},
           {label: "Price", name: "price", widget: "string"},
           {label: "Features", name: "features", widget: "list"}
         ]}}

collections:
  - name: "contact"
    label: "Contact Submissions"
    folder: "content/contact"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }
    # Netlify Forms (auto-handled) or custom function:
    submit_url: "/.netlify/functions/handle-form"



